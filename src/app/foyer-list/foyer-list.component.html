<app-header></app-header>
<app-sidebar></app-sidebar>

<body>
  <main id="main" class="main">
    <div class="container">
      <h2>Liste des foyers</h2>
      <div class="mb-3">
        <div class="search-bar">
          <form class="search-form d-flex align-items-right" method="POST" action="">
            <input type="text" name="query" placeholder="Search" title="Enter search keyword">
            <button type="submit" title="Search"><i class="bi bi-search"></i></button>
          </form>
        </div><!-- Fin de la barre de recherche -->

        <!-- Bouton "Ajouter un foyer" -->
        <button class="btn btn-success" (click)="redirectToCreateFoyer()">Ajouter un nouveau foyer</button>
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Capacité</th>
            <th>ID de l'Université</th>
            <th>Blocs</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let foyer of foyers">
            <td>{{ foyer.id }}</td>
            <td>{{ foyer.nomFoyer }}</td>
            <td>{{ foyer.capaciteFoyer }}</td>
            <td>{{ foyer.universiteId }}</td>
            <td>{{ foyer.blocs }}</td>
            <td>
              <!-- Boutons d'action -->
              <button (click)="redirectToEdit(foyer.id)" class="btn btn-primary">Modifier</button>
              <button (click)="supprimerFoyer(foyer.id)" class="btn btn-danger">Delete</button>

            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>

<app-footer></app-footer>
