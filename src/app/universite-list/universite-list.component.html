<app-header></app-header>
<app-sidebar></app-sidebar>

<body>
  <main id="main" class="main">
    <div class="container">
      <h2>Liste des Universités</h2>
      <div class="mb-3">
        <!-- Barre de recherche -->
        <div class="search-bar">
          <form class="search-form d-flex align-items-right" method="POST" action="">
            <input type="text" name="query" placeholder="Search" title="Enter search keyword">
            <button type="submit" title="Search"><i class="bi bi-search"></i></button>
          </form>
        </div>

        <!-- Bouton "Ajouter une nouvelle université" -->
        <button class="btn btn-success" (click)="redirectToCreateUniversite()">Ajouter une nouvelle université</button>
      </div>

      <!-- Tableau pour afficher les universités -->
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom de l'Université</th>
            <th>Adresse</th>
            <th>ID du Foyer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let universite of universites">
            <td>{{ universite.idUniversite }}</td>
            <td>{{ universite.nomUniversite }}</td>
            <td>{{ universite.adresse }}</td>
            <td>{{ universite.idFoyer }}</td>
            <td>
              <!-- Boutons pour éditer et supprimer -->
              <button class="btn btn-primary btn-sm" (click)="redirectToEditUniversite(universite.idUniversite)">
                Éditer
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteUniversite(universite.idUniversite)">
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>

<app-footer></app-footer>
