<app-header></app-header>
<app-sidebar></app-sidebar>

<body>
  <main id="main" class="main">
    <div class="container">
      <h2>Liste des Universités</h2>

      <!-- Affichage des messages d'erreur s'il y en a -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <!-- Affichage d'un message de chargement si les données sont en cours de récupération -->
      <div *ngIf="loading" class="spinner-border text-primary" role="status">
        <span class="sr-only">Chargement...</span>
      </div>

      <!-- Tableau pour afficher les universités -->
      <table class="table table-striped" *ngIf="universites && universites.length > 0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom de l'Université</th>
            <th>Adresse</th>
            <th>ID du Foyer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let universite of universites">
            <td>{{ universite.idUniversite }}</td>
            <td>{{ universite.nomUniversite }}</td>
            <td>{{ universite.adresse }}</td>
            <td>{{ universite.idFoyer }}</td>
            <td>
              <!-- Boutons pour éditer et supprimer -->
              <button class="btn btn-primary btn-sm" (click)="editUniversite(universite.idUniversite)">
                Éditer
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteUniversite(universite.idUniversite)">
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Message si aucune université n'est trouvée -->
      <div *ngIf="universites && universites.length === 0" class="alert alert-info">
        Aucune université trouvée.
      </div>
    </div>
  </main>
</body>

<app-footer></app-footer>
