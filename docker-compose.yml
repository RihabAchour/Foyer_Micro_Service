version: "3.9"
services:
  
    
  University:
    container_name: university
    image: msuniversity
    build: .\MSFoyer
    ports:
      - "9090:8080"   
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - "Eureka"

 
 

 
  Eureka:
    container_name: eureka
    build: .\Eureka
    hostname: serviceregistry
    ports:
      - "8761:8761"   
    image: eureka    
    environment:
      - eureka.client.serviceUrl.defaultZone=http://serviceregistry:8761/eureka/
    
  
 
      
      
  api-gateway:
    build: .\MS_API_Gateway
    image: apigateway
    ports:
      - "8086:8086"  # Port mapping pour l'API Gateway
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - "Eureka"
      - "University"
      
  
  
  
    




  
  